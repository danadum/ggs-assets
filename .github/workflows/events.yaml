name: Update events.json

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: events

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GGE
        run: python3 -I scripts/gen_events.py --game gge --previous gge/events.json --out gge/events.json --report "$RUNNER_TEMP/unpublished-gge.txt"

      - name: Generate E4K
        if: always()
        run: python3 -I scripts/gen_events.py --game e4k --previous e4k/events.json --out e4k/events.json --report "$RUNNER_TEMP/unpublished-e4k.txt"

      - name: Commit
        if: always()
        run: |
          if git diff --quiet -- gge/events.json e4k/events.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update events.json from the game files" -- gge/events.json e4k/events.json
          git push

      - name: Report lists that need a line in the script
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: New game rankings not published automatically
        run: |
          for game in gge e4k; do [ -f "$RUNNER_TEMP/unpublished-$game.txt" ] || exit 0; done
          cat "$RUNNER_TEMP/unpublished-gge.txt" "$RUNNER_TEMP/unpublished-e4k.txt" > "$RUNNER_TEMP/unpublished.txt"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -s "$RUNNER_TEMP/unpublished.txt" ]; then
            {
              echo "The scheduled run found ranking lists it cannot publish on its own. Add a line to the table at the top of scripts/gen_events.py (LINK, TITLE or EXCLUDE). This issue closes itself once the list is handled."
              echo
              echo '```'
              cat "$RUNNER_TEMP/unpublished.txt"
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every ranking list is published now."
          fi

      # GitHub disables a scheduled workflow after 60 days without repository activity.
      - name: Keep the schedule enabled
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/events.yaml/enable"
